server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: githubsearcher
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/github_searcher}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

github:
  api:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    per-page: 30
    connect-timeout: 5s
    read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    use-root-path: true
  override-with-generic-response: false